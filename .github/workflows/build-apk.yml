name: Build Android APK

# How to change the site the app loads:
#   Option A (permanent): edit SERVER_URL below and push -> a new build runs.
#   Option B (one-off):   Actions tab -> "Build Android APK" -> Run workflow ->
#                         type the URL in the "server_url" box.
# When you move to Frappe Cloud, just set SERVER_URL to e.g.
#   https://yoursite.frappe.cloud   (https is auto-detected -> secure scheme)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Site URL the app loads (leave blank to use SERVER_URL below)"
        required: false
        default: ""
  push:
    branches: [ main ]

env:
  # ▼▼▼ THE ONLY LINE YOU NORMALLY CHANGE ▼▼▼
  SERVER_URL: "https://entering-undiluted-slinging.ngrok-free.dev"
  # ▲▲▲ (local PC IP for now; swap for the Frappe Cloud https URL later) ▲▲▲

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve server URL
        id: url
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then URL="${SERVER_URL}"; fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "Building app that loads: $URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: Inject server URL into capacitor.config.json
        env:
          APP_URL: ${{ steps.url.outputs.value }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = 'capacitor.config.json';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const url = process.env.APP_URL;
          const isHttps = url.startsWith('https');
          cfg.server = Object.assign({}, cfg.server, {
            url,
            cleartext: !isHttps,                 // http needs cleartext; https does not
            androidScheme: isHttps ? 'https' : 'http'
          });
          cfg.android = Object.assign({}, cfg.android, { allowMixedContent: !isHttps });
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          console.log('Final capacitor.config.json:\n' + JSON.stringify(cfg, null, 2));
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor (copies web + config into android project)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: n-air-hvac-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
